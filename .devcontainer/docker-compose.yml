services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/DocumentReader-web-java-client
      - vscode-gradle-volume:/home/vscode/.gradle
      - vscode-m2-volume:/home/vscode/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GRADLE_USER_HOME=/home/vscode/.gradle
    privileged: true

volumes:
  vscode-gradle-volume:
  vscode-m2-volume:
