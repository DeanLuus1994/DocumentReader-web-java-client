services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/DocumentReader-web-java-client
      - vscode-gradle-volume:/home/vscode/.gradle
      - vscode-m2-volume:/home/vscode/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GRADLE_USER_HOME=/home/vscode/.gradle
    privileged: true
    # Add healthcheck to ensure container stays running and can recover
    healthcheck:
      test: [ "CMD", "ps", "aux", "||", "exit", "1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Container will keep running even if the entrypoint script exits
    init: true
    # Explicitly set container-exit-behavior to avoid stopping container
    restart: unless-stopped

volumes:
  vscode-gradle-volume:
  vscode-m2-volume:
